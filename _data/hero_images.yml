# Rotating hero images for the home page.
#
# Upload the corresponding files to /assets/images/hero/.
# Images are shown in this order, changing every 10 seconds.
#
# "position" is optional and controls which part of the image remains visible
# when it is cropped to fill the hero area. Typical values:
#   center
#   center 35%
#   50% 30%
#
# Example:
#
# - image: /assets/images/hero/mount-kenya-01.jpg
#   alt: Mount Kenya
#   position: center
#
- image: /assets/images/hero/mount-kenya-flora.jpg
  alt: "Flora in the Mount Kenya region (photo: Beni Brem, 2024)"
  position: center 35%

- image: /assets/images/hero/mount-kenya-gaw-station.jpg
  alt: "Global GAW station Mount Kenya (photo: Beni Brem, 2024)"
  position: center 35%

- image: /assets/images/hero/mount-kenya-measurement-field.jpg
  alt: "Measurement field at the Global GAW station Mount Kenya (photo: Jörg Klausen)"
  position: center 35%

- image: /assets/images/hero/mount-kenya-mountain-view.jpg
  alt: "Mountain view in the Mount Kenya region (photo: Beni Brem, 2024)"
  position: center 35%

- image: /assets/images/hero/mount-kenya-towards-old-moses.jpg
  alt: "View from the Global GAW station Mount Kenya (photo: Beni Brem, 2024)"
  position: center 35%

- image: /assets/images/hero/mount-kenya-towards-summit.jpg
  alt: "Mountain view in the Mount Kenya region (photo: Jörg Klausen)"
  position: center 35%
