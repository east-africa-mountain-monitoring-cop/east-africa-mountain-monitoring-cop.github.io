# Symposium programme data.
#
# Normal full-width programme entry
# ---------------------------------
#
# - day: "Day 1"
#   date: "YYYY-MM-DD"
#   items:
#     - time: "09:00"
#       end: "09:30"
#       title: "Opening"
#       type: "plenary"
#       speaker: ""
#       location: ""
#       description: ""
#
#
# Parallel streams with independent timelines
# -------------------------------------------
#
# A parallel block defines the overall time window. Each track then contains
# its own independently timed list of programme items.
#
# Example:
#
#     - time: "11:00"
#       end: "12:30"
#       title: "Parallel sessions"
#       type: "parallel"
#       tracks:
#         - name: "Stream A"
#           title: "Climate observations"
#           location: "Main Hall"
#           chair: ""
#           items:
#             - time: "11:00"
#               end: "11:20"
#               title: "Presentation A1"
#               speaker: ""
#               description: ""
#             - time: "11:20"
#               end: "11:40"
#               title: "Presentation A2"
#               speaker: ""
#               description: ""
#             - time: "11:40"
#               end: "12:30"
#               title: "Discussion"
#               speaker: ""
#               description: ""
#
#         - name: "Stream B"
#           title: "Atmospheric composition"
#           location: "Meeting Room"
#           chair: ""
#           items:
#             - time: "11:00"
#               end: "11:30"
#               title: "Presentation B1"
#               speaker: ""
#               description: ""
#             - time: "11:30"
#               end: "12:00"
#               title: "Presentation B2"
#               speaker: ""
#               description: ""
#             - time: "12:00"
#               end: "12:30"
#               title: "Discussion"
#               speaker: ""
#               description: ""
#
# The streams do not need to use identical sub-times. The outer time/end simply
# identifies the overall parallel-session window.
#
